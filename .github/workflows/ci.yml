name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Type-check & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Tests unitarios
        run: npm test

  deploy:
    name: Deploy a producción (Next.js)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Crear .vercel/project.json
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' \
            '${{ secrets.VERCEL_PROJECT_ID }}' \
            '${{ secrets.VERCEL_ORG_ID }}' > .vercel/project.json

      - name: Deploy a producción
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

  # nuxt-app/ es un proyecto Vercel APARTE del de la raíz, y ESTE JOB ES LA ÚNICA
  # COSA QUE LO DESPLIEGA. No lo borres.
  #
  # Se despliega desde la RAÍZ del repo, no desde nuxt-app/. El proyecto tiene su
  # Root Directory en `nuxt-app`, así que Vercel entra él solo a esa carpeta. Si el
  # CLI subiera únicamente nuxt-app/ como origen, Vercel buscaría nuxt-app/nuxt-app
  # y el deploy se queda colgado sin arrancar (pasó con ba02424: 24 min en el paso
  # de deploy, hubo que cancelarlo a mano). Origen = repo completo, igual que el
  # hook de Git.
  #
  # `--prod` fuerza el alias de producción, y `needs: check` lo gatea con tsc+tests.
  # No hace falta paso de Prisma: nuxt-app/package.json ya corre `prisma generate`
  # en postinstall, y el build ocurre dentro de Vercel.
  deploy-nuxt:
    name: Deploy a producción (nuxt-app)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      # En la raíz, no en nuxt-app/: es el origen que se sube. Lleva el projectId de
      # nuxt-app, así que apunta a ese proyecto aunque el contexto sea el repo entero.
      - name: Crear .vercel/project.json
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' \
            '${{ secrets.VERCEL_NUXT_PROJECT_ID }}' \
            '${{ secrets.VERCEL_ORG_ID }}' > .vercel/project.json

      - name: Deploy a producción
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
