name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Type-check & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Tests unitarios
        run: npm test

  deploy:
    name: Deploy a producción (Next.js)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Crear .vercel/project.json
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' \
            '${{ secrets.VERCEL_PROJECT_ID }}' \
            '${{ secrets.VERCEL_ORG_ID }}' > .vercel/project.json

      - name: Deploy a producción
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

  # nuxt-app/ es un proyecto Vercel APARTE del de la raíz, y ESTE JOB ES LA ÚNICA
  # COSA QUE LO DESPLIEGA. No lo borres.
  #
  # El proyecto figura como conectado a este repo en Vercel, pero su integración de
  # Git no crea deployments para los pushes a master (verificado: los commits
  # bd8639e, bf077a1 y 56d816d no aparecen siquiera en su lista de Deployments).
  # Este job ya no es un duplicado: sin él, cualquier cambio a los módulos migrados
  # (transporte, tienda, cargue-gourmet, preoperacional, integracion, exportaciones)
  # se queda en git sin llegar a los usuarios. `--prod` fuerza el alias de producción.
  #
  # Ventaja adicional sobre el hook de Git: `needs: check` lo gatea con tsc + tests.
  # No hace falta paso de Prisma: nuxt-app/package.json ya corre `prisma generate`
  # en postinstall, y el build ocurre dentro de Vercel.
  deploy-nuxt:
    name: Deploy a producción (nuxt-app)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    defaults:
      run:
        working-directory: nuxt-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Crear .vercel/project.json
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' \
            '${{ secrets.VERCEL_NUXT_PROJECT_ID }}' \
            '${{ secrets.VERCEL_ORG_ID }}' > .vercel/project.json

      - name: Deploy a producción
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
